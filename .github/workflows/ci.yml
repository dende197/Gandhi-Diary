name: CI & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high

      - name: Install frontend build and test tools
        run: npm ci --prefix frontend

      - name: Audit frontend build tools
        run: npm audit --prefix frontend --audit-level=high

      - name: Check generated frontend assets
        if: ${{ !cancelled() }}
        run: npm run build --prefix frontend && git diff --exit-code -- assets

      - name: Run automated unit & security tests
        if: ${{ !cancelled() }}
        run: npm test
